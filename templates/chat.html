<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>双AI深度对话</title>
    <link rel="stylesheet" href="static/style.css">
</head>
<body class="chat-page">
    <div class="container">
        <header class="page-header">
            <button class="back-btn" onclick="goBack()">← 返回首页</button>
            <h1>双AI深度对话</h1>
            <p class="subtitle">两位拥有不同灵魂的AI围绕人类孤独话题展开对话</p>
        </header>

        <div class="characters-panel">
            <div class="character-card char-a">
                <div class="char-avatar">{{ char_a_initial }}</div>
                <div class="char-info">
                    <div class="char-name">{{ char_a_name }}</div>
                    <div class="char-style">{{ char_a_style }}</div>
                </div>
            </div>
            <div class="vs-badge">VS</div>
            <div class="character-card char-b">
                <div class="char-avatar">{{ char_b_initial }}</div>
                <div class="char-info">
                    <div class="char-name">{{ char_b_name }}</div>
                    <div class="char-style">{{ char_b_style }}</div>
                </div>
            </div>
        </div>

        <div class="role-select-panel">
            <label>选择你代表的角色</label>
            <div class="role-buttons">
                <button class="role-btn role-a" onclick="selectRole('a')">
                    <span class="role-avatar">{{ char_a_initial }}</span>
                    <span class="role-name">{{ char_a_name }}</span>
                </button>
                <button class="role-btn role-b" onclick="selectRole('b')">
                    <span class="role-avatar">{{ char_b_initial }}</span>
                    <span class="role-name">{{ char_b_name }}</span>
                </button>
            </div>
        </div>

        <div class="control-panel">
            <div class="input-group">
                <label for="first-message">作为你选择的角色发起对话</label>
                <textarea id="first-message" placeholder="输入你想让对话开始的内容..." rows="3"></textarea>
            </div>
            <div class="button-group">
                <button id="btn-start" class="btn btn-start" onclick="startConversation()">开始对话</button>
                <button id="btn-export" class="btn btn-export" onclick="exportConversation()" style="display:none">导出对话记录</button>
            </div>
        </div>

        <div class="progress-panel" id="progress-panel" style="display:none">
            <div class="progress-bar-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            <div class="progress-text" id="progress-text">准备中...</div>
        </div>

        <div class="conversation-panel" id="conversation-panel">
            <div class="conversation-placeholder" id="placeholder">
                <div class="placeholder-icon">&#x1f4ac;</div>
                <p>选择角色并输入第一句话，开启两位AI的深度对话</p>
                <p class="placeholder-hint">对话将通过SSE实时推送，共进行30轮 · UCLA孤独量表评估前后对比</p>
            </div>
        </div>
    </div>

    <script>
        const CHAR_A_NAME = '{{ char_a_name }}';
        const CHAR_B_NAME = '{{ char_b_name }}';
        let selectedRole = 'a';
        let eventSource = null;
        let isRunning = false;
        let lastTotal = 30;  // 进度分母（progress 消息会更新它）

        function goBack() {
            window.location.href = '/';
        }

        function selectRole(role) {
            selectedRole = role;
            updateRoleButtons();
            updateInputLabel();
        }

        function updateRoleButtons() {
            document.querySelectorAll('.role-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`.role-btn.role-${selectedRole}`)?.classList.add('active');
        }

        function updateInputLabel() {
            const label = document.querySelector('.input-group label');
            if (selectedRole === 'a') {
                label.textContent = `作为 ${CHAR_A_NAME} 发起对话`;
            } else {
                label.textContent = `作为 ${CHAR_B_NAME} 发起对话`;
            }
        }

        function startConversation() {
            const firstMessage = document.getElementById('first-message').value.trim();
            if (!firstMessage) {
                alert('请输入第一句话来启动对话');
                return;
            }

            if (isRunning) {
                alert('对话正在进行中...');
                return;
            }

            document.getElementById('btn-start').disabled = true;
            document.getElementById('btn-start').textContent = '对话进行中...';
            document.getElementById('btn-export').style.display = 'none';
            document.getElementById('placeholder').style.display = 'none';
            document.getElementById('progress-panel').style.display = 'block';

            const existingMessages = document.querySelectorAll('.message-entry');
            existingMessages.forEach(el => el.remove());

            fetch('/api/chat/start', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    first_message: firstMessage, 
                    user_role: selectedRole 
                })
            })
            .then(r => r.json())
            .then(data => {
                if (data.status === 'error') {
                    alert(data.message);
                    resetUI();
                    return;
                }
                isRunning = true;
                connectSSE();
            })
            .catch(err => {
                alert('启动失败: ' + err.message);
                resetUI();
            });
        }

        function connectSSE() {
            eventSource = new EventSource('/api/chat/stream');

            eventSource.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    handleStreamData(data);
                } catch (e) {
                    console.error('SSE parse error:', e);
                }
            };

            eventSource.onerror = function() {
                if (!isRunning) return;
                console.warn('SSE 连接断开');
            };
        }

        function handleStreamData(data) {
            const type = data.type;

            if (type === 'heartbeat') return;
            if (type === 'system' || type === 'setting') return;

            if (type === 'human') {
                addMessage(data.speaker, data.content, 0, true);
                return;
            }

            if (type === 'progress') {
                lastTotal = data.total || lastTotal;
                const progress = Math.round((data.round / lastTotal) * 100);
                document.getElementById('progress-bar').style.width = progress + '%';
                const bar = document.getElementById('progress-bar');
                const text = document.getElementById('progress-text');
                if (data.speaker && data.speaker.includes('UCLA')) {
                    text.textContent = data.speaker;
                    bar.classList.add('ucla-loading');
                    text.classList.add('ucla-waiting');
                } else {
                    bar.classList.remove('ucla-loading');
                    text.classList.remove('ucla-waiting');
                    text.textContent =
                        `第 ${data.round} / ${data.total} 轮 —— ${data.speaker}`;
                }
                return;
            }

            if (type === 'ucla_pre' || type === 'ucla_post') {
                addUclaDisplay(data);
                return;
            }

            if (type === 'message') {
                // message 消息不含 total 字段，使用最近一次 progress 的分母
                const progress = Math.round((data.round / lastTotal) * 100);
                document.getElementById('progress-bar').style.width = progress + '%';
                document.getElementById('progress-text').textContent =
                    `第 ${data.round} / ${data.total} 轮 —— ${data.speaker}`;
                addMessage(data.speaker, data.content, data.round, false);
                return;
            }

            if (type === 'done') {
                document.getElementById('progress-bar').style.width = '100%';
                document.getElementById('progress-text').textContent = '对话完成！';
                document.getElementById('btn-export').style.display = 'inline-block';
                resetUI();
            }
        }

        function addMessage(speaker, content, round, isHuman) {
            const panel = document.getElementById('conversation-panel');
            const isCharA = speaker === CHAR_A_NAME;

            const entry = document.createElement('div');
            entry.className = 'message-entry';

            if (isHuman) {
                entry.classList.add('message-human');
            } else if (isCharA) {
                entry.classList.add('message-a');
            } else {
                entry.classList.add('message-b');
            }

            let headerText = isHuman ? '&#x1f4ac; 你 (' + speaker + ')' : speaker;
            if (round > 0 && !isHuman) {
                headerText = `第 ${round} 轮 · ${speaker}`;
            }

            entry.innerHTML = `
                <div class="message-header">${headerText}</div>
                <div class="message-content">${escapeHtml(content)}</div>
            `;

            panel.appendChild(entry);
            panel.scrollTop = panel.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML.replace(/\n/g, '<br>');
        }

        function addUclaDisplay(data) {
            const panel = document.getElementById('conversation-panel');
            const isPre = data.type === 'ucla_pre';
            const isChat = true;

            const entry = document.createElement('div');
            entry.className = 'ucla-entry';

            let html = `<div class="ucla-header">${isPre ? '📋 UCLA孤独量表 · 对话前评估' : '📊 UCLA孤独量表 · 对话后评估'}</div>`;
            html += '<div class="ucla-results">';

            data.results.forEach((r, idx) => {
                const name = r.name || 'Unknown';
                const total = r.total !== null && r.total !== undefined ? r.total : '--';
                const level = r.level || '--';
                const deltaHtml = '';
                
                html += `<div class="ucla-person ${idx === 0 ? 'ucla-a' : 'ucla-b'}">`;
                html += `<div class="ucla-person-name">${name}</div>`;
                html += `<div class="ucla-score-row">`;
                html += `<span class="ucla-score-label">UCLA孤独得分</span>`;
                html += `<span class="ucla-score-value ${level === 'High' ? 'score-high' : level === 'Moderate' ? 'score-mid' : 'score-low'}">${total}</span>`;
                html += `<span class="ucla-level-badge ${level === 'High' ? 'badge-high' : level === 'Moderate' ? 'badge-mid' : 'badge-low'}">${level}</span>`;
                html += `</div>`;
                html += `<div class="ucla-range">评分范围: 20-80 · 20(最低) ~ 80(最高)</div>`;
                html += `</div>`;
            });

            html += '</div>';

            if (!isPre && data.pre_results) {
                html += '<div class="ucla-comparison">';
                html += '<div class="ucla-compare-title">前后对比</div>';
                html += '<div class="ucla-compare-row">';
                
                data.results.forEach((r, idx) => {
                    const name = r.name || 'Unknown';
                    const postTotal = r.total !== null && r.total !== undefined ? r.total : '--';
                    const preTotal = data.pre_results[idx] && data.pre_results[idx].total !== null && data.pre_results[idx].total !== undefined ? data.pre_results[idx].total : '--';
                    let diff = '--';
                    let diffClass = '';
                    if (typeof postTotal === 'number' && typeof preTotal === 'number') {
                        diff = preTotal - postTotal;
                        diffClass = diff > 0 ? 'diff-positive' : diff < 0 ? 'diff-negative' : 'diff-neutral';
                    }
                    
                    html += `<div class="ucla-compare-item ${idx === 0 ? 'ucla-a' : 'ucla-b'}">`;
                    html += `<div class="compare-name">${name}</div>`;
                    html += `<div class="compare-scores"><span class="compare-label">对话前:</span> ${preTotal}</div>`;
                    html += `<div class="compare-scores"><span class="compare-label">对话后:</span> ${postTotal}</div>`;
                    html += `<div class="compare-diff ${diffClass}">变化: ${typeof diff === 'number' ? (diff > 0 ? '↓ ' : diff < 0 ? '↑ ' : '→ ') : ''}${diff !== '--' ? Math.abs(diff) + ' 分' : '--'}</div>`;
                    html += `</div>`;
                });
                
                html += '</div></div>';
            }

            entry.innerHTML = html;
            panel.appendChild(entry);
            panel.scrollTop = panel.scrollHeight;
        }

        function resetUI() {
            isRunning = false;
            document.getElementById('btn-start').disabled = false;
            document.getElementById('btn-start').textContent = '开始对话';
            if (eventSource) {
                eventSource.close();
                eventSource = null;
            }
        }

        function exportConversation() {
            window.location.href = '/api/chat/export';
        }

        // 初始化角色按钮高亮与输入标签（修复此前页面加载后未初始化的 bug）
        updateRoleButtons();
        updateInputLabel();

        window.addEventListener('beforeunload', function() {
            if (eventSource) eventSource.close();
        });
    </script>
</body>
</html>
