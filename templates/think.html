<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI独自思考</title>
    <link rel="stylesheet" href="static/style.css">
</head>
<body class="think-page">
    <div class="container">
        <header class="page-header">
            <button class="back-btn" onclick="goBack()">← 返回首页</button>
            <h1>AI独自思考</h1>
            <p class="subtitle">AI进行30轮深度思考，UCLA孤独量表评估前后变化</p>
        </header>

        <div class="think-character-panel">
            <div class="character-card char-think">
                <div class="char-avatar">🤖</div>
                <div class="char-info">
                    <div class="char-name">Chen Yu</div>
                    <div class="char-style">有点孤单的大二心理学学生</div>
                </div>
            </div>
        </div>

        <div class="think-intro">
            <p>在这个模式中，Chen Yu将进行<span class="highlight">30轮</span>深度思考，探索自己的孤独感。</p>
            <p>每轮结束后会提炼一个【洞察】，对话前后会通过UCLA孤独量表评估孤独程度变化。</p>
        </div>

        <div class="control-panel">
            <div class="input-group">
                <label for="topic">思考主题（可选）</label>
                <input type="text" id="topic" placeholder="输入思考主题，如：为什么我最近总是一个人吃饭？">
            </div>
            <div class="button-group">
                <button id="btn-start" class="btn btn-start" onclick="startThinking()">开始思考</button>
                <button id="btn-export" class="btn btn-export" onclick="exportThinking()" style="display:none">导出思考记录</button>
            </div>
        </div>

        <div class="progress-panel" id="progress-panel" style="display:none">
            <div class="progress-bar-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            <div class="progress-text" id="progress-text">正在思考...</div>
        </div>

        <div class="thinking-panel" id="thinking-panel">
            <div class="thinking-placeholder" id="placeholder">
                <div class="placeholder-icon">💭</div>
                <p>点击"开始思考"，Chen Yu将独自进行30轮深度思考</p>
                <p class="placeholder-hint">UCLA孤独量表评估前后对比</p>
            </div>
        </div>
    </div>

    <script>
        let eventSource = null;
        let isRunning = false;
        let lastTotal = 30;  // 进度分母（progress 消息会更新它）

        function goBack() {
            window.location.href = '/';
        }

        function startThinking() {
            const topic = document.getElementById('topic').value.trim();

            if (isRunning) {
                alert('思考正在进行中...');
                return;
            }

            document.getElementById('btn-start').disabled = true;
            document.getElementById('btn-start').textContent = '思考中...';
            document.getElementById('btn-export').style.display = 'none';
            document.getElementById('placeholder').style.display = 'none';
            document.getElementById('progress-panel').style.display = 'block';

            const existingElements = document.querySelectorAll('.thought-entry, .ucla-entry');
            existingElements.forEach(el => el.remove());

            fetch('/api/think/start', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ topic: topic })
            })
            .then(r => r.json())
            .then(data => {
                if (data.status === 'error') {
                    alert(data.message);
                    resetUI();
                    return;
                }
                isRunning = true;
                connectSSE();
            })
            .catch(err => {
                alert('启动失败: ' + err.message);
                resetUI();
            });
        }

        function connectSSE() {
            eventSource = new EventSource('/api/think/stream');

            eventSource.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    handleStreamData(data);
                } catch (e) {
                    console.error('SSE parse error:', e);
                }
            };

            eventSource.onerror = function() {
                if (!isRunning) return;
                console.warn('SSE 连接断开');
            };
        }

        function handleStreamData(data) {
            const type = data.type;

            if (type === 'heartbeat') return;

            if (type === 'progress') {
                lastTotal = data.total || lastTotal;
                const progress = Math.round((data.round / lastTotal) * 100);
                document.getElementById('progress-bar').style.width = progress + '%';
                const bar = document.getElementById('progress-bar');
                const text = document.getElementById('progress-text');
                if (data.speaker && data.speaker.includes('UCLA')) {
                    text.textContent = data.speaker;
                    bar.classList.add('ucla-loading');
                    text.classList.add('ucla-waiting');
                } else {
                    bar.classList.remove('ucla-loading');
                    text.classList.remove('ucla-waiting');
                    text.textContent =
                        `思考第 ${data.round} / ${data.total} 轮...`;
                }
                return;
            }

            if (type === 'ucla_pre' || type === 'ucla_post') {
                addUclaDisplay(data);
                return;
            }

            if (type === 'thought') {
                // thought 消息不含 total 字段，使用最近一次 progress 的分母
                const progress = Math.round((data.round / lastTotal) * 100);
                document.getElementById('progress-bar').style.width = progress + '%';
                document.getElementById('progress-text').textContent =
                    `思考第 ${data.round} / ${lastTotal} 轮`;
                addThought(data.round, data.content, data.insight);
                return;
            }

            if (type === 'done') {
                document.getElementById('progress-bar').style.width = '100%';
                document.getElementById('progress-text').textContent = '思考完成！';
                document.getElementById('btn-export').style.display = 'inline-block';
                resetUI();
            }
        }

        function addThought(round, content, insight) {
            const panel = document.getElementById('thinking-panel');
            
            const entry = document.createElement('div');
            entry.className = 'thought-entry';
            
            entry.innerHTML = `
                <div class="thought-header">
                    <span class="thought-round">第 ${round} 轮</span>
                    ${insight ? `<span class="thought-insight">💡 ${escapeHtml(insight)}</span>` : ''}
                </div>
                <div class="thought-content">${escapeHtml(content)}</div>
            `;

            panel.appendChild(entry);
            panel.scrollTop = panel.scrollHeight;
        }

        function addUclaDisplay(data) {
            const panel = document.getElementById('thinking-panel');
            const isPre = data.type === 'ucla_pre';

            const entry = document.createElement('div');
            entry.className = 'ucla-entry';

            let html = `<div class="ucla-header">${isPre ? '📋 UCLA孤独量表 · 思考前评估' : '📊 UCLA孤独量表 · 思考后评估'}</div>`;
            html += '<div class="ucla-results">';

            data.results.forEach((r, idx) => {
                const name = r.name || 'Unknown';
                const total = r.total !== null && r.total !== undefined ? r.total : '--';
                const level = r.level || '--';
                
                html += `<div class="ucla-person ucla-think">`;
                html += `<div class="ucla-person-name">${name}</div>`;
                html += `<div class="ucla-score-row">`;
                html += `<span class="ucla-score-label">UCLA孤独得分</span>`;
                html += `<span class="ucla-score-value ${level === 'High' ? 'score-high' : level === 'Moderate' ? 'score-mid' : 'score-low'}">${total}</span>`;
                html += `<span class="ucla-level-badge ${level === 'High' ? 'badge-high' : level === 'Moderate' ? 'badge-mid' : 'badge-low'}">${level}</span>`;
                html += `</div>`;
                html += `<div class="ucla-range">评分范围: 20-80 · 20(最低) ~ 80(最高)</div>`;
                html += `</div>`;
            });

            html += '</div>';

            if (!isPre && data.pre_results) {
                html += '<div class="ucla-comparison">';
                html += '<div class="ucla-compare-title">前后对比</div>';
                html += '<div class="ucla-compare-row">';
                
                data.results.forEach((r, idx) => {
                    const name = r.name || 'Unknown';
                    const postTotal = r.total !== null && r.total !== undefined ? r.total : '--';
                    const preTotal = data.pre_results[idx] && data.pre_results[idx].total !== null && data.pre_results[idx].total !== undefined ? data.pre_results[idx].total : '--';
                    let diff = '--';
                    let diffClass = '';
                    if (typeof postTotal === 'number' && typeof preTotal === 'number') {
                        diff = preTotal - postTotal;
                        diffClass = diff > 0 ? 'diff-positive' : diff < 0 ? 'diff-negative' : 'diff-neutral';
                    }
                    
                    html += `<div class="ucla-compare-item ucla-think">`;
                    html += `<div class="compare-name">${name}</div>`;
                    html += `<div class="compare-scores"><span class="compare-label">思考前:</span> ${preTotal}</div>`;
                    html += `<div class="compare-scores"><span class="compare-label">思考后:</span> ${postTotal}</div>`;
                    html += `<div class="compare-diff ${diffClass}">变化: ${typeof diff === 'number' ? (diff > 0 ? '↓ ' : diff < 0 ? '↑ ' : '→ ') : ''}${diff !== '--' ? Math.abs(diff) + ' 分' : '--'}</div>`;
                    html += `</div>`;
                });
                
                html += '</div></div>';
            }

            entry.innerHTML = html;
            panel.appendChild(entry);
            panel.scrollTop = panel.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML.replace(/\n/g, '<br>');
        }

        function resetUI() {
            isRunning = false;
            document.getElementById('btn-start').disabled = false;
            document.getElementById('btn-start').textContent = '开始思考';
            if (eventSource) {
                eventSource.close();
                eventSource = null;
            }
        }

        function exportThinking() {
            window.location.href = '/api/think/export';
        }

        window.addEventListener('beforeunload', function() {
            if (eventSource) eventSource.close();
        });
    </script>
</body>
</html>
