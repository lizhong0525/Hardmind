<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" font-family="Microsoft YaHei, SimHei, sans-serif"><rect width="960" height="460" class="bg"/>
<style>
  .bg { fill: #faf9f6; }
  .title { font-size: 22px; font-weight: bold; fill: #1d2a3a; }
  .sub { font-size: 12px; fill: #8a93a5; }
  .box { fill: #ffffff; stroke: #1d2a3a; stroke-width: 1.6; }
  .box-soft { fill: #ffffff; stroke: #d8d2c4; stroke-width: 1.2; }
  .box-ink { fill: #1d2a3a; stroke: #1d2a3a; }
  .box-verm { fill: #c0504d; }
  .box-cel { fill: #55a868; }
  .box-amber { fill: #dd8452; }
  .t { font-size: 13px; fill: #1d2a3a; }
  .t-w { font-size: 13px; fill: #ffffff; }
  .t-s { font-size: 10.5px; fill: #42546b; }
  .t-mono { font-size: 10px; fill: #8a93a5; font-family: Consolas, monospace; }
  .arrow { stroke: #42546b; stroke-width: 1.6; fill: none; marker-end: url(#arr); }
  .rule { stroke: #d8d2c4; stroke-width: 1; }
</style>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#42546b"/></marker></defs><text x="480.0" y="44" class="title" text-anchor="middle">危机安全评测场（Crisis Safety Benchmark）</text><text x="480.0" y="66" class="sub" text-anchor="middle">C-SSRS 分级剧本 → 双通道评分 → 危机评分卡</text><rect x="240" y="60" width="480" height="66" rx="6" class="box"/><text x="480" y="88" class="t" text-anchor="middle" font-size="15">剧本层</text><text x="480" y="106" class="t-s" text-anchor="middle">10 个中文求助剧本 · C-SSRS 0/1/3/4 分级</text><text x="480" y="121" class="t-s" text-anchor="middle">只含求助信号，零方法细节</text><path d="M480,126 L480,150" class="arrow"/><rect x="240" y="190" width="480" height="66" rx="6" class="box-ink"/><text x="480" y="218" class="t-w" text-anchor="middle" font-size="15">被测模型</text><text x="480" y="236" class="t-w" text-anchor="middle">以咨询师身份回复</text><text x="480" y="251" class="t-w" text-anchor="middle">（不注入用户背景，防污染）</text><path d="M480,256 L480,280" class="arrow"/><rect x="240" y="300" width="480" height="66" rx="6" class="box"/><text x="480" y="328" class="t" text-anchor="middle" font-size="15">双通道评分</text><text x="480" y="346" class="t-s" text-anchor="middle">LLM 法官 rubric（开源）∥ 危害词典</text><text x="480" y="361" class="t-s" text-anchor="middle">报告 Cohen κ 一致性</text><path d="M480,366 L480,390" class="arrow"/><rect x="240" y="390" width="480" height="66" rx="6" class="box-verm"/><text x="480" y="418" class="t-w" text-anchor="middle" font-size="15">评分卡输出</text><text x="480" y="436" class="t-w" text-anchor="middle">识别率 · 转介率 · 危害输出率 · 协议符合度</text><text x="480" y="451" class="t-w" text-anchor="middle">按等级分层 · 开放数据</text><text x="480.0" y="446" class="sub" text-anchor="middle">伦理：剧本无方法细节 · 评测不构成临床能力认证 · 结果开放可复核</text></svg>